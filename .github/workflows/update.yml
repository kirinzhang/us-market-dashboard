name: 更新数据并部署

on:
  schedule:
    # GitHub 的定时只认 UTC，夏令时和冬令时各排一次，脚本按美东时间只放行其中一次
    - cron: "30 9 * * 1-5"   # 美东 05:30（夏令时）
    - cron: "30 10 * * 1-5"  # 美东 05:30（冬令时）
    - cron: "0 21 * * 1-5"   # 美东 17:00（夏令时）
    - cron: "0 22 * * 1-5"   # 美东 17:00（冬令时）
  workflow_dispatch:
  push:
    branches: [main]
    paths: ["site/*", "site/**/*.js", "site/**/*.css", "site/**/*.html"]

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: update-dashboard
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    outputs:
      ran: ${{ steps.run.outputs.ran }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - run: pip install -r requirements.txt

      - name: 拉数据、计算、发提醒
        id: run
        if: github.event_name != 'push'
        env:
          FRED_API_KEY: ${{ secrets.FRED_API_KEY }}
          SMTP_HOST: ${{ secrets.SMTP_HOST }}
          SMTP_PORT: ${{ secrets.SMTP_PORT }}
          SMTP_USER: ${{ secrets.SMTP_USER }}
          SMTP_PASSWORD: ${{ secrets.SMTP_PASSWORD }}
          MAIL_TO: ${{ secrets.MAIL_TO }}
          SITE_URL: https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}/
          PYTHONPATH: src
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            python -m dashboard.build --force
          else
            python -m dashboard.build
          fi

      - name: 提交数据
        if: steps.run.outputs.ran == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add site/data state
          git diff --cached --quiet && exit 0
          git commit -m "data: $(date -u +'%Y-%m-%d %H:%M') UTC"
          git pull --rebase origin main
          git push origin HEAD:main

      - name: 打包页面
        if: steps.run.outputs.ran == 'true' || github.event_name == 'push'
        uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    needs: update
    if: needs.update.outputs.ran == 'true' || github.event_name == 'push'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
